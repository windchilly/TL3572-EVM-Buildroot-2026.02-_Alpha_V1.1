#@TYPE: Machine
#@NAME: TL3572-EVM
#@DESCRIPTION: Tronlong TL3572-EVM based on Rockchip RK3572

MACHINEOVERRIDES =. "tl3572:"

# Keep the first BSP milestone ABI-compatible with the validated stage-2
# userspace and shared sstate.  The RK3572 topology is 6x Cortex-A53 plus
# 2x Cortex-A73; CPU-specific optimization can be evaluated after the vendor
# kernel and MICA CPU-reservation path are reproducible.
require conf/machine/include/arm/arch-arm64.inc
DEFAULTTUNE = "aarch64"
TUNE_CCARGS .= " -mlittle-endian"

MACHINE_FEATURES = "usbhost usbgadget pci"
SERIAL_CONSOLES = "115200;ttyFIQ0"
USE_VT = "0"

KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = "rockchip/tl3572-evm.dtb"

# Stage 3 milestone 1 remains rootfs-only and keeps the verified vendor
# boot.img (Linux 6.12.69, DTB, TF-A and OP-TEE).  A linux-tl3572 provider is
# introduced only after its source and boot-image inputs are reproducible.
PREFERRED_PROVIDER_virtual/kernel = "linux-dummy"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = ""
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS = ""

export ROOTFS_PACKAGE_ARCH = "aarch64"
